<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f3f4f6;
        }
        h1 {
            color: #1e40af;
        }
        .user-card {
            background: #fff;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .user-card button {
            margin-left: 5px;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }
        .approve-btn { background: #16a34a; }
        .delete-btn { background: #dc2626; }
    </style>
</head>
<body>

<h1>Admin Panel</h1>
<button onclick="loadUsers()">Load Pending Users</button>
<div id="users">
    <!-- Pending users will be loaded here -->
</div>
<script>
    // Check if user is logged in and is admin
    const token = localStorage.getItem("token")
    const role = localStorage.getItem("role")  // we will save role on login

    if (!token || role !== "admin") {
        alert("Access denied! Login as admin first.")
        window.location.href = "index.html"
    }
</script>
<script src="script.js"></script>
<script>
    // ----------------- Basic Admin Functions -----------------

    async function loadUsers() {
        const res = await fetch("/api/pending-users", {
            headers: {
                // No full security: just a placeholder, works locally
                authorization: localStorage.getItem("token") || ""
            }
        })
        const users = await res.json()
        const container = document.getElementById("users")
        container.innerHTML = ""

        if(users.length === 0) {
            container.innerHTML = "<p>No pending users</p>"
            return
        }

        users.forEach(user => {
            const div = document.createElement("div")
            div.className = "user-card"
            div.innerHTML = `
                <span>${user.name} - ${user.email}</span>
                <span>
                    <button class="approve-btn" onclick="approveUser('${user._id}')">Approve</button>
                    <button class="delete-btn" onclick="deleteUser('${user._id}')">Delete</button>
                </span>
            `
            container.appendChild(div)
        })
    }

    async function approveUser(id) {
        await fetch("/api/approve/" + id, {
            method: "POST",
            headers: { authorization: localStorage.getItem("token") || "" }
        })
        alert("User approved")
        loadUsers()
    }

    async function deleteUser(id) {
        await fetch("/api/delete-user/" + id, {
            method: "DELETE",
            headers: { authorization: localStorage.getItem("token") || "" }
        })
        alert("User deleted")
        loadUsers()
    }

    // Load users automatically when page opens
    loadUsers()
</script>

</body>
</html>
